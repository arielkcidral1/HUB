<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://nblfwesptlpetbwfmdqf.supabase.co; media-src 'self' blob: https://nblfwesptlpetbwfmdqf.supabase.co; connect-src 'self' https://nblfwesptlpetbwfmdqf.supabase.co wss://nblfwesptlpetbwfmdqf.supabase.co https://challenges.cloudflare.com; object-src 'none'; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <title>Envio de Atestado | HUB RH</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="public-layout" data-public-atestados="true">
      <div class="public-container contractor-doc-container">
        <div class="public-brand">
          <img class="public-brand-logo" src="assets/logo.svg" alt="HUB RH" />
          <strong>HUB</strong>
        </div>

        <header class="public-header">
          <p class="eyebrow">Departamento Pessoal</p>
          <h1>Envio de atestado</h1>
          <p class="public-header-text">Preencha seus dados e anexe o atestado para análise do RH.</p>
        </header>

        <form class="panel" id="atestado-form" data-public-atestados="true">
          <div class="panel-header">
            <div>
              <h2>Dados do colaborador</h2>
              <p class="item-meta">O envio será encaminhado diretamente para o RH.</p>
            </div>
          </div>

          <input class="hidden" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />

          <label>Nome e sobrenome
            <input name="nome" type="text" minlength="3" maxlength="120" pattern="\S+\s+\S+.*" placeholder="Nome completo" autocomplete="name" required />
          </label>

          <div class="form-grid form-grid-md">
            <label>CPF
              <input id="atestado-cpf" name="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required />
            </label>
            <label>Telefone
              <input id="atestado-telefone" name="telefone" type="tel" inputmode="tel" maxlength="16" placeholder="(00) 00000-0000" autocomplete="tel" required />
            </label>
          </div>

          <label>Unidade
            <select name="unidade" data-unit-select data-unit-placeholder="Selecione a unidade" required>
              <option value="" disabled selected>Selecione a unidade</option>
              <option>1- MTZ</option>
              <option>2- SBS</option>
              <option>3- ITJ 1</option>
              <option>4- PLÇ</option>
              <option>5- GUA</option>
              <option>7- DPA JC</option>
              <option>9- DPA IRI</option>
              <option>10- JPL</option>
              <option>11- BC</option>
              <option>12- GCS GPO</option>
              <option>12- GCS JLLE</option>
              <option>13- JRG 1</option>
              <option>14- BRQ</option>
              <option>15- FLN</option>
              <option>17- FAC</option>
              <option>19- RNG 1</option>
              <option>20- BNU 1</option>
              <option>21- JRG 2</option>
              <option>22- TRINCA</option>
              <option>23- ITJ 2</option>
              <option>26- BNU 2</option>
              <option>28- ARA</option>
            </select>
          </label>

          <label>Anexar atestado
            <input name="atestado" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,application/pdf,image/jpeg,image/png,image/webp,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required />
          </label>
          <p class="item-meta">Formatos aceitos: PDF, imagem, DOC ou DOCX. Tamanho máximo: 10 MB.</p>

          <button class="primary-button" type="submit">Enviar atestado</button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2" integrity="sha384-JWEyvHh+lRf0sN/WWY+QTQwX+CyWqmNg4tkc8GQzAMEtR2wGNrCJlvnu1lHD1kDm" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
