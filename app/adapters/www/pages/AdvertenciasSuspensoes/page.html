        <section class="view" id="advertencias-suspensoes">
          <div class="document-workspace">
            <aside class="panel doc-menu">
              <div class="panel-header split-header">
                <div>
                  <h2>Medidas disciplinares</h2>
                  <p class="item-meta">Advertencias e suspensoes</p>
                </div>
              </div>
              <button class="doc-tab disciplinary-tab" data-disciplinary-doc="advertencia" type="button">Advertencia</button>
              <button class="doc-tab disciplinary-tab" data-disciplinary-doc="suspensao" type="button">Suspensao</button>
            </aside>

            <div class="doc-content">
              <div class="chat-empty-state" id="disciplinary-empty-state">
                <img src="assets/logo.svg" alt="HUB" />
                <strong>HUB</strong>
              </div>
              <section class="doc-view disciplinary-view" id="disciplinary-advertencia">
                <form class="panel doc-form disciplinary-form" data-disciplinary-form="advertencia" autocomplete="off">
                  <input name="id" type="hidden" />
                  <div class="panel-header split-header">
                    <div>
                      <h2>Advertencia</h2>
                      <p class="item-meta">Salve o registro para gerar o documento e anexar depois</p>
                    </div>
                  </div>
                  <label>Nome do funcionario<input name="colaborador" required /></label>
                  <div class="form-grid">
                    <label>Data da advertencia<input name="data_medida" type="date" required /></label>
                    <label>Unidade do funcionario<select name="unidade" data-unit-select required></select></label>
                    <label>Local<input name="local" placeholder="Cidade" autocomplete="off" required /></label>
                  </div>
                  <label>Motivo<textarea name="motivo" rows="4" required></textarea></label>
                  <label class="disciplinary-file-field" data-disciplinary-anexo-field hidden>Anexo
                    <span class="disciplinary-file-control">
                      <span class="disciplinary-file-button">Anexar arquivo</span>
                      <span class="disciplinary-file-name" data-empty-label="Nenhum arquivo escolhido">Nenhum arquivo escolhido</span>
                    </span>
                    <input class="disciplinary-file-input" name="anexo" type="file" accept="image/*,.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                  </label>
                  <button class="primary-button" type="submit">Salvar advertencia</button>
                  <button class="secondary-link full-width-action" data-disciplinary-cancel-edit type="button" hidden>Cancelar edição</button>
                </form>
              </section>

              <section class="doc-view disciplinary-view" id="disciplinary-suspensao">
                <form class="panel doc-form disciplinary-form" data-disciplinary-form="suspensao" autocomplete="off">
                  <input name="id" type="hidden" />
                  <div class="panel-header split-header">
                    <div>
                      <h2>Suspensao</h2>
                      <p class="item-meta">Salve o registro para gerar o documento e anexar depois</p>
                    </div>
                  </div>
                  <label>Nome do funcionario<input name="colaborador" required /></label>
                  <div class="form-grid">
                    <label>Data da suspensao<input name="data_medida" type="date" required /></label>
                    <label>Unidade do funcionario<select name="unidade" data-unit-select required></select></label>
                    <label>Local<input name="local" placeholder="Cidade" autocomplete="off" required /></label>
                  </div>
                  <label>Dias de suspensao<input name="dias_suspensao" type="number" min="1" step="1" placeholder="Ex: 3" required /></label>
                  <label>Motivo<textarea name="motivo" rows="4" required></textarea></label>
                  <label class="disciplinary-file-field" data-disciplinary-anexo-field hidden>Anexo
                    <span class="disciplinary-file-control">
                      <span class="disciplinary-file-button">Anexar arquivo</span>
                      <span class="disciplinary-file-name" data-empty-label="Nenhum arquivo escolhido">Nenhum arquivo escolhido</span>
                    </span>
                    <input class="disciplinary-file-input" name="anexo" type="file" accept="image/*,.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                  </label>
                  <button class="primary-button" type="submit">Salvar suspensao</button>
                  <button class="secondary-link full-width-action" data-disciplinary-cancel-edit type="button" hidden>Cancelar edição</button>
                </form>
              </section>

              <div class="panel" id="disciplinary-registros-panel" hidden>
                <div class="panel-header">
                  <h2>Registros salvos</h2>
                </div>
                <div class="vt-filter-bar disciplinary-filter-bar" aria-label="Filtros de Advertencias e Suspensoes">
                  <button class="secondary-link vt-report-button" id="abrir-relatorio-disciplinary" type="button">Relatorio</button>
                  <div class="vt-filter-fields disciplinary-filter-fields">
                    <input id="disciplinary-filter-name" type="search" placeholder="Nome" autocomplete="off" aria-label="Filtrar por nome" />
                    <input id="disciplinary-filter-observations" type="search" placeholder="Motivo" autocomplete="off" aria-label="Filtrar por motivo" />
                    <select id="disciplinary-filter-date" aria-label="Filtrar por mes">
                      <option value="">Mes</option>
                      <option value="01">Janeiro</option>
                      <option value="02">Fevereiro</option>
                      <option value="03">Marco</option>
                      <option value="04">Abril</option>
                      <option value="05">Maio</option>
                      <option value="06">Junho</option>
                      <option value="07">Julho</option>
                      <option value="08">Agosto</option>
                      <option value="09">Setembro</option>
                      <option value="10">Outubro</option>
                      <option value="11">Novembro</option>
                      <option value="12">Dezembro</option>
                    </select>
                    <select id="disciplinary-filter-unit" aria-label="Filtrar por unidade" data-unit-select data-unit-placeholder="Unidade"></select>
                  </div>
                  <button class="secondary-link compact-filter-button" id="clear-disciplinary-filters" type="button" hidden>Limpar</button>
                </div>
                <div class="card-list" id="disciplinary-records"></div>
              </div>
            </div>
          </div>
        </section>
