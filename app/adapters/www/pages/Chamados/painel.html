        <section class="view" id="chamados">
          <div class="panel panel-spaced">
            <div class="panel-header split-header flush-bottom">
              <div>
                <h2>Chamados de EPI</h2>
                <p class="item-meta">Solicitacoes abertas pelos colaboradores</p>
              </div>
              <div class="job-actions flush-top">
                <button class="danger-button" id="excluir-arquivados-chamados" type="button" hidden>Apagar arquivados</button>
                <button class="secondary-link" id="toggle-archived-chamados" type="button">Mostrar arquivados</button>
                <a class="secondary-link" id="open-chamados-public" href="chamados.html" target="_blank" rel="noreferrer">Abrir solicitação</a>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-header chamados-records-header">
              <h2 id="chamados-primary-title">Abertos</h2>
              <div class="chamados-filter-bar" aria-label="Filtros de chamados">
                <div class="chamados-filter-fields">
                  <input id="chamado-filter-colaborador" type="search" placeholder="Colaborador" autocomplete="off" aria-label="Filtrar chamados por colaborador" />
                  <input id="chamado-filter-codigo" type="search" inputmode="numeric" maxlength="6" placeholder="xxxx-x" autocomplete="off" aria-label="Filtrar chamados por codigo da solicitacao" />
                  <select id="chamado-filter-mes" aria-label="Filtrar chamados por mes">
                    <option value="">Mês</option>
                    <option>Janeiro</option>
                    <option>Fevereiro</option>
                    <option>Março</option>
                    <option>Abril</option>
                    <option>Maio</option>
                    <option>Junho</option>
                    <option>Julho</option>
                    <option>Agosto</option>
                    <option>Setembro</option>
                    <option>Outubro</option>
                    <option>Novembro</option>
                    <option>Dezembro</option>
                  </select>
                  <select id="chamado-filter-destino" data-unit-select data-unit-placeholder="Unidade" aria-label="Filtrar chamados por destino"></select>
                </div>
                <button class="secondary-link compact-filter-button" id="limpar-filtros-chamados" type="button" hidden>Limpar</button>
              </div>
            </div>
            <div class="card-list chamado-list" id="chamados-list"></div>
          </div>
        </section>
