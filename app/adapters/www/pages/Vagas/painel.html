<section class="view" id="vagas">
  <div class="workspace">
    <form class="panel form-panel" id="vaga-form">
      <div class="panel-header split-header">
        <div>
          <h2>Cadastrar vaga</h2>
        </div>
        <a class="secondary-link" href="vagas.html" target="_blank" rel="noreferrer">Ver portal publico</a>
      </div>
      <input name="id" type="hidden" />
      <label>Cargo
        <input name="cargo" placeholder="Ex: Tecnico de Seguranca" required />
      </label>
      <label>Unidade destinada
        <select name="unidade" data-unit-select required></select>
      </label>
      <label>Descricao
        <textarea name="descricao" rows="4" placeholder="Resumo das atividades da vaga" required></textarea>
      </label>
      <label>Requisitos
        <textarea name="requisitos" rows="4" placeholder="Experiencia, cursos, disponibilidade..." required></textarea>
      </label>
      <label>Status
        <select name="status">
          <option>Aberta</option>
          <option>Fechada</option>
        </select>
      </label>
      <button class="primary-button" type="submit">Salvar vaga</button>
      <button class="secondary-link full-width-action" id="cancelar-edicao-vaga" type="button" hidden>Cancelar edicao</button>
    </form>
    <div class="panel">
      <div class="panel-header chamados-records-header">
        <h2>Vagas cadastradas</h2>
        <div class="chamados-filter-bar" aria-label="Filtros de vagas">
          <div class="chamados-filter-fields vaga-filter-fields">
            <input id="vaga-filter-nome" type="search" placeholder="Nome do candidato" autocomplete="off" aria-label="Filtrar vagas por nome do candidato" />
            <input id="vaga-filter-cpf" type="search" inputmode="numeric" maxlength="14" placeholder="CPF" autocomplete="off" aria-label="Filtrar vagas por CPF do candidato" />
            <select id="vaga-filter-cargo" aria-label="Filtrar vagas por cargo">
              <option value="">Cargo</option>
            </select>
            <select id="vaga-filter-unidade" data-unit-select data-unit-placeholder="Unidade" aria-label="Filtrar vagas por unidade"></select>
            <label class="vaga-filter-checkbox" for="vaga-filter-curriculo">
              <input type="checkbox" id="vaga-filter-curriculo" />
              <span>Somente com currículo</span>
            </label>
          </div>
          <button class="secondary-link compact-filter-button" id="limpar-filtros-vagas" type="button" hidden>Limpar</button>
        </div>
      </div>
      <div class="card-list" id="vagas-list"></div>
    </div>
  </div>
</section>
