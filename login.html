<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com; object-src 'none'; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <title>Login | HUB RH</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=restauracao-v8" />
  </head>
  <body>
    <section class="login-screen" id="login-screen">
      <div class="login-card">
        <div class="login-brand">
          <img class="brand-logo" src="assets/logo.svg" alt="HUB RH" />
          <div>
            <strong>HUB</strong>
            <span>Acesso do RH</span>
          </div>
        </div>
        <form id="login-form" method="post" action="login.html" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
          <label>E-mail ou CPF
            <input name="identificador" type="text" autocomplete="off" inputmode="text" data-lpignore="true" data-1p-ignore="true" required />
          </label>
          <label>Senha
            <input name="senha" type="password" autocomplete="off" data-lpignore="true" data-1p-ignore="true" required />
          </label>
          <p class="login-error" id="login-error" role="alert"></p>
          <button class="primary-button" type="submit">Entrar</button>
        </form>
      </div>
    </section>
    <script src="hub-postgres-client.js?v=db-load-v2"></script>
    <script src="login-submit.js?v=login-submit-v3"></script>
    <script src="script.js?v=file-preview-chip-v64"></script>
  </body>
</html>
