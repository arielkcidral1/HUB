<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://nblfwesptlpetbwfmdqf.supabase.co; media-src 'self' blob: https://nblfwesptlpetbwfmdqf.supabase.co; connect-src 'self' https://nblfwesptlpetbwfmdqf.supabase.co wss://nblfwesptlpetbwfmdqf.supabase.co https://challenges.cloudflare.com; object-src 'none'; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <title>Denuncia Anonima | HUB RH</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=mensagens-v7" />
  </head>
  <body>
    <div class="public-layout">
      <div class="public-container">
        <div class="public-brand">
          <img class="public-brand-logo" src="assets/logo.svg" alt="HUB RH" />
          <strong>HUB</strong>
        </div>

        <header class="public-header">
          <p class="eyebrow">Canal seguro e confidencial</p>
          <h1>Denuncia anonima</h1>
        </header>

        <form class="panel" id="denuncia-form" data-public-denuncia="true">
          <div class="panel-header">
            <h2>Enviar denuncia</h2>
          </div>
          <label class="bot-field" aria-hidden="true" tabindex="-1">Nao preencha este campo
            <input name="website" type="text" autocomplete="off" tabindex="-1" />
          </label>
          <p class="public-description">Este canal não solicita nome, documento, telefone ou e-mail. Sua denuncia é totalmente anonima e segura.</p>
          <label>Mensagem da denuncia
            <textarea name="mensagem" rows="7" maxlength="4000" placeholder="Descreva sua situação" required></textarea>
          </label>
          <p class="form-feedback" id="denuncia-feedback" role="status"></p>
          <button class="primary-button" type="submit">Enviar denuncia anonima</button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2" integrity="sha384-JWEyvHh+lRf0sN/WWY+QTQwX+CyWqmNg4tkc8GQzAMEtR2wGNrCJlvnu1lHD1kDm" crossorigin="anonymous"></script>
    <script src="script.js?v=mensagens-v7"></script>
  </body>
</html>
