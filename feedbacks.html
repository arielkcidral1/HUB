<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com; object-src 'none'; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <title>Fale com nossa diretoria | HUB RH</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=feedbacks-v1" />
  </head>
  <body>
    <div class="public-layout">
      <div class="public-container">
        <div class="public-brand">
          <img class="public-brand-logo" src="assets/logo.svg" alt="HUB RH" />
          <strong>HUB</strong>
        </div>

        <header class="public-header">
          <p class="eyebrow">Canal de sugestoes e reclamacoes</p>
          <h1>Fale com nossa diretoria</h1>
        </header>

        <form class="panel" id="feedbacks-form" data-public-feedbacks="true">
          <div class="panel-header">
            <h2>Enviar mensagem</h2>
          </div>
          <label class="bot-field" aria-hidden="true" tabindex="-1">Nao preencha este campo
            <input name="website" type="text" autocomplete="off" tabindex="-1" />
          </label>
          <p class="public-description">Use este espaco para registrar uma sugestao ou reclamacao. A identificacao e obrigatoria para que a diretoria possa entender melhor o contexto.</p>
          <label>Nome completo
            <input name="nome" type="text" autocomplete="name" maxlength="120" required />
          </label>
          <label>Mensagem
            <textarea name="mensagem" rows="7" maxlength="4000" placeholder="Escreva sua sugestao ou reclamacao" required></textarea>
          </label>
          <p class="form-feedback" id="feedbacks-feedback" role="status"></p>
          <button class="primary-button" type="submit">Enviar para a diretoria</button>
        </form>
      </div>
    </div>
    <script src="hub-postgres-client.js"></script>
    <script src="script.js?v=feedbacks-form-fix-v2"></script>
  </body>
</html>
